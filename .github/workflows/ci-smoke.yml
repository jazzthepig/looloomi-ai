name: CI Smoke (import + boot gate)

# The gate that blocks broken code from reaching main. On every push/PR it
# installs deps and verifies the app can IMPORT and BOOT. A missing import or a
# startup error fails the check — exactly the failure mode that silently broke
# production for 5 days on 2026-06-14.
#
# 2026-09-18: paths scope extended to scripts/** + tests/**. Without this, any
# change to scripts/ops_console.py (or any other scripts/ file) bypassed the
# gate entirely — and scripts/ contains the local ops console where S-371
# (`import json as _json` / `import urllib.request as _rq` missing in three
# try/except branches) silently rendered as upstream errors. The fix is
# twofold: (1) extend paths so the gate RUNS on these changes, (2) add a
# `compileall` step that catches SyntaxError before the runtime smoke test
# gets a chance to skip the file. compileall is parse-only (does NOT execute
# top-level code), so it won't false-fail on scripts that need env vars.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "scripts/smoke_test.py"
      - ".github/workflows/ci-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"

concurrency:
  group: ci-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile scripts + tests (syntax gate)
        # compileall is parse-only — it does NOT execute top-level code, so it
        # won't false-fail on scripts that need env vars (e.g., ops_console.py
        # reading SUPABASE_URL at import time). It DOES catch SyntaxError,
        # IndentationError, and bad escapes. Catches the cheap regressions
        # without paying the runtime import cost.
        run: |
          python -m compileall -q scripts tests

      - name: Smoke test — import + boot
        env:
          INTERNAL_TOKEN: ci-smoke
          ENVIRONMENT: ci
        run: python scripts/smoke_test.py
