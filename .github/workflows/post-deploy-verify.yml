name: Post-deploy / uptime watchdog

# The external watchdog the in-app heartbeat can't be (it dies with the app).
# Would have caught the 2026-06-14 → 06-19 silent outage in minutes.
#
# ⚠️ Runs on SCHEDULE + manual dispatch ONLY — never on `push`. A push-triggered
# post-deploy check deadlocks with Railway's "Wait for CI" (Railway waits for all
# checks green before deploying, but this check is designed to fail until the deploy
# is live → it can never go green → Railway never deploys). Cron catches outages
# within 30 min; for a specific deploy, dispatch it with expect_sha.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      expect_sha:
        description: "Optional: verify the live deployment matches this sha"
        required: false
        default: ""

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Verify live deployment + freshness
        id: check
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # give Railway time to build+boot, then confirm the live sha matches
            sleep 120
            python scripts/post_deploy_check.py --expect-sha "${{ github.sha }}" --retries 12 --sleep 30
          else
            python scripts/post_deploy_check.py --retries 4 --sleep 20
          fi
      - name: Telegram alert on failure (optional)
        if: failure() && env.TG_TOKEN != ''
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="🔴 looloomi watchdog FAILED on ${{ github.event_name }} (${{ github.sha }}). Check Railway deploy + Mac scheduler." || true
